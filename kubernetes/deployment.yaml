apiVersion: apps/v1
kind: Deployment
metadata:
  name: lavern
  namespace: lavern
  labels:
    app.kubernetes.io/name: lavern
    app.kubernetes.io/managed-by: autopoc
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lavern
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lavern
    spec:
      containers:
        - name: lavern
          image: quay.io/aicatalyst/lavern-lavern:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              protocol: TCP
          env:
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: lavern-secrets
                  key: ANTHROPIC_API_KEY
            - name: SHEM_HOST
              value: "0.0.0.0"
            - name: SHEM_PORT
              value: "3000"
            - name: SHEM_DB_PATH
              value: "/app/data/lavern.db"
            - name: SHEM_AUDIT_DIR
              value: "/app/audit-logs"
            - name: SHEM_CORS_ORIGINS
              value: "*"
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - name: lavern-data
              mountPath: /app/data
            - name: lavern-data
              mountPath: /app/audit-logs
              subPath: audit-logs
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
      volumes:
        - name: lavern-data
          persistentVolumeClaim:
            claimName: lavern-data
